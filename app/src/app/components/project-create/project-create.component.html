<app-sidebar/>

<div class="center">
    <h1>Create a New Project</h1>

    <form (ngSubmit)="onSubmit()">
        <div class="field">
            <label for="project-name">Name:</label>
            <input type="email" id="project-name" name="project-name" [(ngModel)]="name" required>
        </div>

        <br>

        <div class="field">
            <label for="project-owner-username">Owner:</label>
            <input type="text" id="project-owner-username" name="project-owner-username" [(ngModel)]="owner" required>
        </div>

        <br>

        <div class="field">
            <label for="project-description">Description:</label>
            <textarea id="project-description" name="project-description" [(ngModel)]="description"></textarea>
        </div>

        <br>

        <button type="submit">Create</button>

        <p>{{ creationMessage }}</p>
    </form>
</div>
